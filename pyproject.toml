[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-singleflight"
version = "0.1.0"
description = "A Python library that runs at most one worker per key and hands every caller the same joinable Future."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "El Fenomeno" }]
keywords = ["singleflight", "thundering-herd", "concurrency", "future", "cache", "python", "deduplication"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/elfenomenokim/resource-singleflight"
Repository = "https://github.com/elfenomenokim/resource-singleflight"
Issues = "https://github.com/elfenomenokim/resource-singleflight/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
